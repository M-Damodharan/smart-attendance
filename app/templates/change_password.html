{% extends "base.html" %}
{% block title %}Change Password · SBG{% endblock %}
{% block content %}
<section class="card narrow">
  <h2>Change password</h2>
  {% if g.user['must_change_pw'] %}<p class="muted">You must set a new password before continuing.</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Current password<input type="password" name="current" required autocomplete="current-password"></label>
    <label>New password (min 8 characters)<input type="password" name="new" minlength="8" required autocomplete="new-password"></label>
    <label>Confirm new password<input type="password" name="confirm" minlength="8" required autocomplete="new-password"></label>
    <button class="btn primary">Update password</button>
  </form>
</section>
{% endblock %}
