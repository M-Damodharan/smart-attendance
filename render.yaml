services:
  - type: web
    name: sbg-attendance
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CODE
        value: HR001
      - key: ADMIN_PASSWORD
        sync: false
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TURSO_DATABASE_URL
        value: "sbg-attendance-m-damodharan.aws-ap-south-1.turso.io"
      - key: TURSO_AUTH_TOKEN
        sync: false

