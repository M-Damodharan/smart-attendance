services:
  - type: web
    name: sbg-attendance
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CODE
        value: HR001
      - key: ADMIN_PASSWORD
        value: "damo12345"
      - key: WEB_CONCURRENCY
        value: "2"
