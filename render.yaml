services:
  - type: web
    name: sbg-attendance
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CODE
        value: HR001
      - key: ADMIN_PASSWORD
        value: "123456789"
